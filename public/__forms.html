<!-- Formulaires déclarés à Netlify Forms : copie e-mail de chaque demande (ne pas supprimer). -->
<meta name="robots" content="noindex" />
<form name="lead" data-netlify="true" netlify-honeypot="site_web" hidden>
  <input type="hidden" name="form-name" value="lead" />
  <input type="hidden" name="subject" value="Nouvelle demande propriétaire amanihost.com" />
  <input name="nom" type="text" />
  <input name="email" type="email" />
  <input name="telephone" type="text" />
  <input name="commune" type="text" />
  <input name="page" type="text" />
  <input name="projet" type="text" />
  <input name="chambres" type="text" />
  <input name="delai" type="text" />
  <input name="piscine" type="text" />
  <input name="climatisation" type="text" />
  <input name="vue_mer" type="text" />
  <input name="consentement" type="text" />
  <input name="site_web" type="text" />
  <textarea name="message"></textarea>
</form>
<form name="candidature" data-netlify="true" netlify-honeypot="site_web" hidden>
  <input type="hidden" name="form-name" value="candidature" />
  <input type="hidden" name="subject" value="Nouvelle candidature concierge amanihost.com" />
  <input name="nom" type="text" />
  <input name="email" type="email" />
  <input name="telephone" type="text" />
  <input name="ville" type="text" />
  <input name="residence" type="text" />
  <input name="anglais" type="text" />
  <input name="demarrage" type="text" />
  <input name="consentement" type="text" />
  <input name="site_web" type="text" />
  <textarea name="parcours"></textarea>
</form>
